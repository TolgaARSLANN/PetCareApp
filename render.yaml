# Render blueprint for the API (backend/server). In Render: New > Blueprint > this repository.
# The frontend is deployed on Vercel (frontend/vercel.json), which forwards /api requests here,
# so the browser sees the site and the API on one address (needed for the SameSite=Strict cookie).
services:
  - type: web
    name: pawfect-care-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend/server
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # A long random secret generated by Render; nobody needs to see or copy it
      - key: JWT_SECRET
        generateValue: true
      # MongoDB Atlas connection string: entered in the Render dashboard, never committed
      - key: MONGO_URI
        sync: false
      # The site's address on Vercel, e.g. https://pawfect-care.vercel.app
      - key: CLIENT_ORIGIN
        sync: false
      # Proxies between the visitor and the API (Vercel + Render's load balancer), so rate limits
      # see the visitor's real IP. Checked after the first deploy; see README > Deployment.
      - key: TRUST_PROXY
        value: "2"
